<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Vgame 项目级策划知识库</title>
  <style>
    :root {
      --paper: #f5f8fc;
      --surface: #ffffff;
      --surface-2: #edf3f9;
      --ink: #142338;
      --muted: #617389;
      --line: #cad7e5;
      --line-strong: #a8bed3;
      --blue: #075f9f;
      --blue-deep: #06436e;
      --cyan: #148fa1;
      --orange: #ec8435;
      --green: #177b65;
      --red: #b64f55;
      --shadow: 0 18px 48px rgba(33, 62, 91, .13);
      --display: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --body: "Microsoft YaHei", "PingFang SC", sans-serif;
      --utility: "Bahnschrift", "Cascadia Code", "Microsoft YaHei UI", monospace;
      --rail: 278px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(7, 95, 159, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(7, 95, 159, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: var(--body);
      line-height: 1.62;
    }

    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: var(--blue); }
    :focus-visible { outline: 3px solid rgba(236, 132, 53, .48); outline-offset: 3px; }

    .app { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 76px;
      display: grid;
      grid-template-columns: var(--rail) minmax(360px, 1fr) auto;
      align-items: stretch;
      background: rgba(250, 252, 255, .95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 24px;
      border-right: 1px solid var(--line);
      text-decoration: none;
      color: var(--ink);
    }
    .brand-mark {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 9px 2px 9px 2px;
      font: 700 20px/1 var(--utility);
      transform: skew(-4deg);
      box-shadow: 5px 5px 0 rgba(20, 143, 161, .2);
    }
    .brand-title { font-family: var(--display); font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    .brand-sub { color: var(--muted); font: 650 10px/1.4 var(--utility); letter-spacing: .14em; text-transform: uppercase; }

    .module-nav { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; }
    .module-nav::-webkit-scrollbar { display: none; }
    .module-tab {
      min-width: 112px;
      padding: 13px 18px 10px;
      border: 0;
      border-right: 1px solid rgba(202, 215, 229, .72);
      background: transparent;
      cursor: pointer;
      text-align: left;
      position: relative;
    }
    .module-tab::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 3px;
      background: transparent;
    }
    .module-tab:hover { background: var(--surface-2); }
    .module-tab.active { color: var(--blue-deep); background: white; }
    .module-tab.active::after { background: var(--orange); }
    .tab-code { display: block; color: var(--muted); font: 650 9px/1 var(--utility); letter-spacing: .08em; white-space: nowrap; }
    .tab-name { display: block; margin-top: 7px; font-weight: 750; }

    .top-tools { display: flex; align-items: center; gap: 8px; padding: 12px 18px; min-width: 0; overflow: hidden; }
    .search-box {
      width: min(280px, 21vw);
      min-width: 170px;
      height: 42px;
      padding: 0 14px 0 38px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background-image: radial-gradient(circle at 17px 17px, transparent 6px, var(--blue) 6.5px, var(--blue) 8px, transparent 8.5px), linear-gradient(45deg, transparent 47%, var(--blue) 49%, var(--blue) 54%, transparent 56%);
      background-size: 22px 22px, 9px 9px;
      background-position: 4px 4px, 24px 25px;
      background-repeat: no-repeat;
    }
    .tool-button, .source-button, .comment-button {
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: white;
      color: var(--blue-deep);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 700;
    }
    .tool-button:hover, .source-button:hover, .comment-button:hover { border-color: var(--blue); background: #f7fbff; }

    .layout { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - 76px); }
    .side-rail {
      position: sticky;
      top: 76px;
      align-self: start;
      height: calc(100vh - 76px);
      padding: 28px 22px 22px;
      background: rgba(244, 248, 252, .94);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .rail-code { color: var(--orange); font: 700 11px/1 var(--utility); letter-spacing: .16em; }
    .rail-title { margin: 12px 0 7px; font: 780 24px/1.25 var(--display); }
    .rail-question { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
    .subnav { display: grid; gap: 5px; }
    .subnav button {
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      text-align: left;
      color: var(--muted);
      cursor: pointer;
    }
    .subnav button:hover, .subnav button.active { color: var(--ink); background: white; border-left-color: var(--orange); }
    .rail-note {
      margin-top: 30px;
      padding-top: 19px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .rail-note strong { color: var(--ink); }

    main { min-width: 0; padding: 42px clamp(26px, 5vw, 78px) 90px; }
    .content-shell { max-width: 1220px; margin: 0 auto; }
    .eyebrow { color: var(--blue); font: 700 11px/1.2 var(--utility); letter-spacing: .17em; text-transform: uppercase; }
    h1, h2, h3 { font-family: var(--display); }
    .page-hero { position: relative; padding: 10px 0 34px; border-bottom: 1px solid var(--line-strong); }
    .page-hero::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 13px;
      width: 7px;
      height: 62px;
      background: linear-gradient(var(--orange) 0 30%, var(--blue) 30% 70%, var(--cyan) 70%);
    }
    .page-hero h1 { max-width: 850px; margin: 13px 0 12px; font-size: clamp(32px, 4.5vw, 60px); line-height: 1.08; letter-spacing: -.04em; }
    .page-lead { max-width: 790px; margin: 0; color: var(--muted); font-size: clamp(15px, 1.5vw, 19px); }
    .hero-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 23px; }
    .comment-button { color: white; background: var(--blue); border-color: var(--blue); }
    .comment-button:hover { color: white; background: var(--blue-deep); }

    .section { padding: 42px 0 8px; scroll-margin-top: 100px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
    .section h2 { margin: 5px 0 0; font-size: clamp(24px, 3vw, 37px); line-height: 1.2; letter-spacing: -.025em; }
    .section-desc { max-width: 680px; color: var(--muted); margin: 9px 0 0; }
    .count-label { color: var(--muted); font: 650 11px/1 var(--utility); letter-spacing: .1em; white-space: nowrap; }

    .knowledge-rail { margin-top: 32px; border: 1px solid var(--line-strong); background: white; box-shadow: var(--shadow); }
    .knowledge-lane {
      width: 100%;
      display: grid;
      grid-template-columns: 154px 1fr auto;
      gap: 20px;
      align-items: center;
      min-height: 112px;
      padding: 20px 24px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    .knowledge-lane:last-child { border-bottom: 0; }
    .knowledge-lane:hover { background: #f7fbff; transform: translateX(5px); }
    .lane-name { font: 780 26px/1 var(--display); }
    .lane-code { display: block; margin-bottom: 9px; color: var(--orange); font: 700 10px/1 var(--utility); letter-spacing: .14em; }
    .lane-question { color: var(--muted); }
    .lane-arrow { color: var(--blue); font: 700 24px/1 var(--utility); }

    .loop-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(100px, 1fr));
      margin-top: 22px;
      overflow-x: auto;
      border: 1px solid var(--line-strong);
      background: white;
    }
    .loop-step { min-width: 120px; padding: 18px 15px; border-right: 1px solid var(--line); position: relative; }
    .loop-step:last-child { border-right: 0; }
    .loop-step:not(:last-child)::after { content: "→"; position: absolute; right: -9px; top: 42%; z-index: 2; color: var(--orange); font-weight: 900; background: white; }
    .loop-step b { display: block; margin-bottom: 5px; font-size: 14px; }
    .loop-step span { color: var(--muted); font-size: 12px; }

    .pillar-list { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); background: white; }
    .pillar { min-height: 175px; padding: 22px 18px; border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
    .pillar-code { color: var(--cyan); font: 700 10px/1 var(--utility); }
    .pillar h3 { margin: 15px 0 9px; font-size: 18px; }
    .pillar p { margin: 0; color: var(--muted); font-size: 13px; }

    .tree-board { margin: 26px 0 4px; padding: 28px; border: 1px solid var(--line-strong); background: #fafdff; }
    .tree-root { display: inline-flex; align-items: center; gap: 10px; padding: 12px 17px; color: white; background: var(--blue-deep); font-weight: 800; }
    .tree-branches { display: grid; grid-template-columns: .85fr 1.6fr; gap: 26px; margin-top: 22px; }
    .tree-branch { position: relative; padding: 19px; border-left: 4px solid var(--cyan); background: white; box-shadow: 0 6px 18px rgba(44, 76, 106, .08); }
    .tree-branch.outer { border-left-color: var(--orange); }
    .tree-branch h3 { margin: 0 0 8px; }
    .tree-branch p { margin: 0; color: var(--muted); }
    .tree-leaves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .tree-leaf { padding: 10px; color: var(--blue-deep); background: var(--surface-2); font-weight: 750; text-align: center; }

    .group-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 25px 0; }
    .filter-chip { padding: 9px 13px; border: 1px solid var(--line); background: white; border-radius: 999px; cursor: pointer; color: var(--muted); }
    .filter-chip.active { color: white; background: var(--blue); border-color: var(--blue); }

    .entity-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .entity-card {
      min-height: 166px;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 2px 10px 2px 10px;
      background: white;
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .entity-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--blue); transform: scaleY(0); transform-origin: top; transition: transform .18s ease; }
    .entity-card:hover { border-color: var(--blue); box-shadow: 0 9px 24px rgba(31, 73, 108, .1); }
    .entity-card:hover::before { transform: scaleY(1); }
    .entity-code { color: var(--muted); font: 650 10px/1 var(--utility); letter-spacing: .08em; }
    .entity-card h3 { margin: 12px 0 7px; font-size: 17px; }
    .entity-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .entity-meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 16px; }
    .entity-meta-left { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .status-tag { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; color: var(--blue-deep); background: #e9f2fa; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .status-tag[data-risk="true"] { color: #8a3b26; background: #fff0e5; }
    .detail-level { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: white; font-size: 10px; font-weight: 750; }
    .detail-level[data-level="full"] { color: #0a6654; border-color: #8dcbbd; background: #e8f7f2; }
    .relation-count { color: var(--muted); font: 650 10px/1 var(--utility); }

    .detail-breadcrumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 13px; color: var(--muted); font: 650 11px/1.35 var(--utility); }
    .detail-breadcrumb button { padding: 0; border: 0; color: var(--blue); background: transparent; cursor: pointer; font: inherit; }
    .detail-kicker { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .detail-kicker .status-tag { border-radius: 4px; }
    .status-axis-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); background: white; }
    .status-axis { min-height: 148px; padding: 17px; border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
    .axis-name { color: var(--muted); font: 700 10px/1 var(--utility); letter-spacing: .11em; }
    .status-axis strong { display: block; margin: 11px 0 7px; line-height: 1.35; }
    .status-axis p { margin: 0; color: var(--muted); font-size: 12px; }
    .source-snapshot { margin-top: 12px; padding: 14px 16px; border-left: 4px solid var(--cyan); background: #edf7fb; color: var(--muted); font-size: 12px; }
    .source-snapshot b { color: var(--blue-deep); }
    .status-guide { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 12px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: white; }
    .status-guide div { padding: 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .status-guide b { display: block; margin-bottom: 5px; color: var(--blue-deep); font: 700 9px/1.3 var(--utility); overflow-wrap: anywhere; }
    .status-guide span { color: var(--muted); font-size: 11px; }
    .scope-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .scope-card { padding: 18px; border: 1px solid var(--line); background: white; }
    .scope-card h3 { margin: 0 0 10px; font-size: 15px; }
    .scope-card ul { margin: 0; padding-left: 19px; color: var(--muted); font-size: 13px; }
    .scope-card li + li { margin-top: 6px; }
    .detail-flow { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 0; overflow-x: auto; border: 1px solid var(--line-strong); background: white; }
    .detail-flow-step { min-width: 180px; padding: 18px; border-right: 1px solid var(--line); position: relative; }
    .detail-flow-step:last-child { border-right: 0; }
    .detail-flow-step:not(:last-child)::after { content: "→"; position: absolute; right: -9px; top: 42%; z-index: 2; color: var(--orange); background: white; font-weight: 900; }
    .detail-flow-step small { color: var(--cyan); font: 700 9px/1 var(--utility); }
    .detail-flow-step b { display: block; margin: 9px 0 5px; }
    .detail-flow-step span { color: var(--muted); font-size: 12px; }
    .rule-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .rule-card { min-width: 0; padding: 20px; border: 1px solid var(--line); border-left: 4px solid var(--blue); background: white; scroll-margin-top: 110px; overflow-wrap: anywhere; }
    .rule-card[data-risk="true"] { border-left-color: var(--orange); }
    .rule-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    .rule-code { color: var(--cyan); font: 700 10px/1 var(--utility); letter-spacing: .08em; }
    .rule-head h3 { margin: 7px 0 0; font-size: 19px; }
    .rule-status { max-width: 48%; padding: 5px 8px; color: var(--blue-deep); background: var(--surface-2); border-radius: 4px; font: 700 9px/1.2 var(--utility); overflow-wrap: anywhere; text-align: right; }
    .rule-card[data-risk="true"] .rule-status { color: #813d28; background: #fff0e5; }
    .rule-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .rule-fact { padding: 13px; background: #f8fbfe; border-top: 2px solid var(--line-strong); }
    .rule-fact b { display: block; margin-bottom: 5px; color: var(--blue-deep); font-size: 12px; }
    .rule-fact p { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .rule-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    .rule-links { color: var(--muted); font: 650 10px/1.4 var(--utility); overflow-wrap: anywhere; }
    .mini-comment { min-height: 34px; padding: 7px 11px; border: 1px solid var(--line-strong); color: var(--blue-deep); background: white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 750; }
    .mini-comment:hover { border-color: var(--blue); background: #f7fbff; }
    .detail-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .detail-card { min-width: 0; padding: 17px; border: 1px solid var(--line); background: white; overflow-wrap: anywhere; }
    .detail-card[data-risk="true"] { border-top: 3px solid var(--orange); }
    .detail-card small { color: var(--cyan); font: 700 9px/1.2 var(--utility); }
    .detail-card h3 { margin: 8px 0 7px; font-size: 16px; }
    .detail-card p { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .detail-card .rule-foot { margin-top: 11px; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); background: white; }
    .table-scroll .relation-table { min-width: 820px; }
    .relation-target { border: 0; padding: 0; color: var(--blue); background: transparent; text-align: left; cursor: pointer; font-weight: 750; }
    .evidence-link { color: var(--blue-deep); font-weight: 750; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .evidence-path { display: block; max-width: 440px; margin-top: 5px; color: var(--muted); font: 600 10px/1.45 var(--utility); overflow-wrap: anywhere; }
    .question-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; }
    .question-card { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 17px; border: 1px solid #edc4aa; background: #fff8f1; overflow-wrap: anywhere; }
    .priority-mark { display: grid; place-items: center; width: 42px; height: 42px; color: white; background: var(--orange); font: 800 11px/1 var(--utility); }
    .question-card h3 { margin: 0 0 5px; font-size: 15px; }
    .question-card p { margin: 0; color: #76513d; font-size: 12px; }

    .split-frame { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .frame-panel { border-top: 5px solid var(--blue); background: white; box-shadow: var(--shadow); }
    .frame-panel.character { border-top-color: var(--orange); }
    .frame-title { padding: 23px 24px 17px; border-bottom: 1px solid var(--line); }
    .frame-title h3 { margin: 4px 0 5px; font-size: 27px; }
    .frame-title p { margin: 0; color: var(--muted); }
    .frame-list { display: grid; }
    .frame-item { padding: 16px 20px; border-bottom: 1px solid var(--line); background: white; cursor: pointer; text-align: left; border-left: 0; border-right: 0; border-top: 0; }
    .frame-item:last-child { border-bottom: 0; }
    .frame-item:hover { background: #f7fbff; }
    .frame-item b { display: block; }
    .frame-item span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .pipeline { display: flex; align-items: stretch; gap: 0; margin: 25px 0 8px; overflow-x: auto; }
    .pipe-node { min-width: 168px; flex: 1; padding: 18px 15px; border: 1px solid var(--line-strong); background: white; position: relative; }
    .pipe-node + .pipe-node { margin-left: 21px; }
    .pipe-node + .pipe-node::before { content: "→"; position: absolute; left: -18px; top: 33%; color: var(--orange); font-size: 20px; font-weight: 900; }
    .pipe-node b { display: block; margin-bottom: 5px; }
    .pipe-node span { color: var(--muted); font-size: 12px; }

    .numeric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .numeric-domain { display: grid; grid-template-columns: 72px 1fr; gap: 15px; min-height: 130px; padding: 20px; border: 1px solid var(--line); background: white; cursor: pointer; text-align: left; }
    .numeric-domain:hover { border-color: var(--cyan); }
    .numeric-id { width: 58px; height: 58px; display: grid; place-items: center; color: white; background: var(--cyan); border-radius: 50% 50% 9px 50%; font: 700 11px/1 var(--utility); }
    .numeric-domain h3 { margin: 0 0 6px; font-size: 18px; }
    .numeric-domain p { margin: 0; color: var(--muted); font-size: 13px; }

    .relation-table { width: 100%; border-collapse: collapse; background: white; }
    .relation-table th, .relation-table td { padding: 14px 15px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .relation-table th { color: var(--blue-deep); background: var(--surface-2); }
    .edge-code { font: 650 11px/1.2 var(--utility); color: var(--cyan); }
    .sample-chain { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 20px; border: 1px solid var(--line-strong); }
    .sample-node { min-height: 130px; padding: 18px; border-right: 1px solid var(--line); background: white; position: relative; }
    .sample-node:last-child { border-right: 0; }
    .sample-node:not(:last-child)::after { content: "→"; position: absolute; right: -9px; top: 44%; z-index: 2; color: var(--orange); font-weight: 900; background: white; }
    .sample-node small { color: var(--muted); font: 650 10px/1 var(--utility); }
    .sample-node b { display: block; margin: 10px 0 5px; }
    .sample-node span { color: var(--muted); font-size: 12px; }

    .search-results { display: grid; gap: 8px; margin-top: 24px; }
    .search-result { display: grid; grid-template-columns: 120px 1fr auto; gap: 16px; align-items: center; width: 100%; padding: 15px 17px; border: 1px solid var(--line); background: white; text-align: left; cursor: pointer; }
    .search-result:hover { border-color: var(--blue); }
    .result-path { color: var(--muted); font: 650 10px/1.3 var(--utility); }
    .result-title { font-weight: 750; }
    .result-summary { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .empty-state { padding: 35px; border: 1px dashed var(--line-strong); color: var(--muted); text-align: center; background: rgba(255,255,255,.72); }

    .governance-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .governance-links a { padding: 16px; border: 1px solid var(--line); background: white; text-decoration: none; font-weight: 700; }
    .warning-strip { margin-top: 20px; padding: 18px 20px; border-left: 5px solid var(--orange); background: #fff7ee; color: #73432b; }

    /* 根横向溢出安全网：长路径/代码/未断词文本强制折行，任何容器不得把 body 撑宽 */
    .content-shell, body { overflow-x: clip; }
    body, pre, code, .result-path, .result-summary { overflow-wrap: anywhere; word-break: break-word; }
    pre { white-space: pre-wrap; }

    .backdrop { position: fixed; inset: 0; z-index: 59; background: rgba(10, 31, 52, .36); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      z-index: 60;
      top: 0;
      right: 0;
      width: min(540px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
      border-left: 1px solid var(--line-strong);
      box-shadow: -24px 0 60px rgba(15, 41, 65, .2);
      transform: translateX(102%);
      transition: transform .24s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; justify-content: space-between; gap: 15px; align-items: start; padding: 25px 26px 18px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 8px 0 0; font-size: 26px; line-height: 1.25; }
    .icon-button { width: 38px; height: 38px; border: 1px solid var(--line); background: white; cursor: pointer; font-size: 21px; }
    .drawer-body { flex: 1; padding: 23px 26px 42px; overflow-y: auto; }
    .drawer-summary { color: var(--muted); font-size: 14px; }
    .detail-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .detail-block h3 { margin: 0 0 11px; font-size: 15px; }
    .relation-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .relation-chip { padding: 6px 9px; color: var(--blue-deep); background: var(--surface-2); border-radius: 999px; font-size: 12px; }
    .review-form { display: grid; gap: 12px; }
    .decision-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .decision-button { min-height: 40px; border: 1px solid var(--line); background: white; cursor: pointer; font-size: 13px; }
    .decision-button.active { color: white; background: var(--blue); border-color: var(--blue); }
    .field-row { display: grid; grid-template-columns: 1.25fr .75fr; gap: 9px; }
    .review-form select, .review-form textarea, .review-form input { width: 100%; padding: 10px 11px; border: 1px solid var(--line-strong); background: white; color: var(--ink); border-radius: 6px; }
    .review-form textarea { min-height: 112px; resize: vertical; }
    .save-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .save-state { color: var(--muted); font-size: 12px; }
    .save-button { min-height: 40px; padding: 9px 16px; border: 0; color: white; background: var(--green); border-radius: 6px; cursor: pointer; font-weight: 750; }

    .toast { position: fixed; z-index: 80; left: 50%; bottom: 28px; padding: 11px 17px; color: white; background: var(--ink); border-radius: 7px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s ease; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    .section-highlight { animation: section-highlight-fade 2.4s ease-out; }
    @keyframes section-highlight-fade {
      0% { background: rgba(236, 132, 53, .22); box-shadow: 0 0 0 2px rgba(236, 132, 53, .4); }
      100% { background: transparent; box-shadow: none; }
    }
    .section-actions { margin-top: 10px; }
    .section-md-body { margin-top: 12px; line-height: 1.65; }
    .section-md-body h1, .section-md-body h2, .section-md-body h3 { margin: 16px 0 8px; }
    .section-md-body ul { padding-left: 22px; }
    .section-md-body table { margin: 10px 0; }
    .section-md-body p { margin: 6px 0; }
    .section-load-btn { margin-top: 8px; }

    @media (max-width: 1320px) {
      :root { --rail: 238px; }
      .topbar { grid-template-columns: 238px minmax(0, 1fr); }
      .top-tools { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 8px 14px; overflow-x: auto; }
      .search-box { flex: 1; width: auto; min-width: 0; }
      .layout { min-height: calc(100vh - 127px); }
      .side-rail { top: 127px; height: calc(100vh - 127px); }
      .pillar-list { grid-template-columns: repeat(3, 1fr); }
      .entity-grid { grid-template-columns: repeat(2, 1fr); }
      .status-axis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .status-guide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 1180px) {
      :root { --rail: 238px; }
    }

    @media (max-width: 820px) {
      .topbar { position: relative; display: block; }
      .brand { border-right: 0; border-bottom: 1px solid var(--line); }
      .module-nav { border-bottom: 1px solid var(--line); }
      .module-tab { min-width: 102px; }
      .top-tools { display: grid; grid-template-columns: 1fr auto; }
      .search-box { width: 100%; min-width: 0; }
      .top-tools { grid-template-columns: minmax(190px, 1fr) repeat(4, max-content); overflow-x: auto; }
      .layout { display: block; }
      .side-rail { position: relative; top: auto; width: 100%; height: auto; padding: 19px 18px; border-right: 0; border-bottom: 1px solid var(--line); }
      .rail-title, .rail-question, .rail-note { display: none; }
      .subnav { display: flex; gap: 6px; overflow-x: auto; }
      .subnav button { width: auto; min-width: max-content; border-left: 0; border-bottom: 3px solid transparent; }
      .subnav button:hover, .subnav button.active { border-left-color: transparent; border-bottom-color: var(--orange); }
      main { padding: 28px 19px 70px; }
      .page-hero::before { left: -10px; }
      .knowledge-lane { grid-template-columns: 110px 1fr auto; padding: 17px; }
      .pillar-list, .entity-grid, .numeric-grid, .governance-links { grid-template-columns: 1fr; }
      .tree-branches, .split-frame { grid-template-columns: 1fr; }
      .scope-grid, .rule-columns, .detail-card-grid { grid-template-columns: 1fr; }
      .tree-leaves { grid-template-columns: repeat(3, 1fr); }
      .sample-chain { grid-template-columns: 1fr; }
      .sample-node { border-right: 0; border-bottom: 1px solid var(--line); }
      .sample-node:last-child { border-bottom: 0; }
      .sample-node:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -12px; }
      .search-result { grid-template-columns: 1fr; gap: 6px; }
    }

    @media (max-width: 520px) {
      .top-tools { grid-template-columns: 1fr auto; }
      .top-tools .tool-button { padding-inline: 10px; }
      .knowledge-lane { grid-template-columns: 1fr auto; }
      .lane-question { grid-column: 1 / -1; }
      .pillar-list { display: block; border-right: 1px solid var(--line-strong); }
      .tree-leaves { grid-template-columns: 1fr; }
      .entity-grid { grid-template-columns: 1fr; }
      .status-axis-grid { grid-template-columns: 1fr; }
      .status-guide { grid-template-columns: 1fr; }
      .question-card { grid-template-columns: 46px 1fr; }
      .question-card .mini-comment { grid-column: 1 / -1; }
      .field-row { grid-template-columns: 1fr; }
      .drawer-head, .drawer-body { padding-left: 20px; padding-right: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#project" aria-label="返回项目总览">
        <span class="brand-mark">V</span>
        <span><span class="brand-title">Vgame 策划知识库</span><span class="brand-sub">project knowledge · v0.4</span></span>
      </a>
      <nav class="module-nav" id="moduleNav" aria-label="知识模块"></nav>
      <div class="top-tools">
        <input class="search-box" id="globalSearch" type="search" placeholder="搜索系统、规则、数值或关系" aria-label="全局搜索">
        <button class="tool-button" type="button" data-route="governance">状态 / 证据</button>
        <button class="tool-button" type="button" data-route="decisions">决策卡</button>
        <button class="tool-button" type="button" id="exportComments" title="导出全部知识库评论">导出评论</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </header>

    <div class="layout">
      <aside class="side-rail">
        <div class="rail-code" id="railCode">00 / PROJECT</div>
        <div class="rail-title" id="railTitle">项目总览</div>
        <p class="rail-question" id="railQuestion"></p>
        <nav class="subnav" id="subnav" aria-label="本模块目录"></nav>
        <div class="rail-note"><strong>阅读原则</strong><br>先看项目和模块，再进入具体系统正文。正文区分目标设计、正式源表、运行状态和待裁决冲突。</div>
      </aside>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerTitle" tabindex="-1">
    <div class="drawer-head">
      <div><div class="eyebrow" id="drawerCode"></div><h2 id="drawerTitle"></h2></div>
      <button class="icon-button" id="closeDrawer" type="button" aria-label="关闭">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="knowledge-model.js"></script>
  <script src="knowledge-search-index.js"></script>
  <script>
    (() => {
      "use strict";
      const KB = window.VGAME_KB;
      const STORAGE_KEY = "vgame-planning-kb-v02-comments";
      const RISK_WORDS = ["冲突", "待确认", "待核", "未开放", "封存", "临时", "缺口", "口径待统一", "部分落地", "发布待核", "规则待闭环", "台账缺口"];
      const moduleNav = document.getElementById("moduleNav");
      const main = document.getElementById("main");
      const subnav = document.getElementById("subnav");
      const railCode = document.getElementById("railCode");
      const railTitle = document.getElementById("railTitle");
      const railQuestion = document.getElementById("railQuestion");
      const searchInput = document.getElementById("globalSearch");
      const drawer = document.getElementById("drawer");
      const backdrop = document.getElementById("backdrop");
      const drawerCode = document.getElementById("drawerCode");
      const drawerTitle = document.getElementById("drawerTitle");
      const drawerBody = document.getElementById("drawerBody");
      const toastEl = document.getElementById("toast");
      let activeModule = "project";
      let activeEntity = null;
      let activeSystemGroup = KB.systemGroups[0]?.id || "battle-in";
      let autoSaveTimer = null;
      let drawerReturnFocus = null;
      let routeEpoch = 0;
      let review = loadReview();
      window.VGAME_SYSTEM_DETAILS = window.VGAME_SYSTEM_DETAILS || {};
      window.VGAME_MODULE_DETAILS = window.VGAME_MODULE_DETAILS || {};
      const detailLoads = {};
      const moduleLoads = {};

      const h = value => String(value ?? "").replace(/[&<>\"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
      const moduleById = id => KB.modules.find(module => module.id === id);
      const groupById = id => KB.systemGroups.find(group => group.id === id);
      const detailById = id => window.VGAME_SYSTEM_DETAILS[id] || null;
      const detailMetaById = id => KB.detailRegistry?.[id] || null;
      const hasDetail = id => Boolean(detailMetaById(id));
      const loadDetail = id => {
        const cached = detailById(id);
        if (cached) return Promise.resolve(cached);
        const meta = detailMetaById(id);
        if (!meta) return Promise.resolve(null);
        if (detailLoads[id]) return detailLoads[id];
        detailLoads[id] = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = meta.chunkRef;
          script.async = true;
          script.onload = () => {
            const detail = detailById(id);
            if (detail) resolve(detail);
            else reject(new Error(`${meta.chunkRef} 未注册 ${id}`));
          };
          script.onerror = () => reject(new Error(`无法加载 ${meta.chunkRef}`));
          document.head.appendChild(script);
        }).catch(error => {
          delete detailLoads[id];
          throw error;
        });
        return detailLoads[id];
      };
      const moduleMetaById = id => KB.moduleRegistry?.find(item => item.moduleId === id) || null;
      const moduleDetailById = id => window.VGAME_MODULE_DETAILS[id] || null;
      const loadModuleDetail = id => {
        const cached = moduleDetailById(id);
        if (cached) return Promise.resolve(cached);
        const meta = moduleMetaById(id);
        if (!meta) return Promise.resolve(null);
        if (moduleLoads[id]) return moduleLoads[id];
        moduleLoads[id] = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = meta.chunkRef;
          script.async = true;
          script.onload = () => {
            const detail = moduleDetailById(id);
            if (detail) resolve(detail);
            else reject(new Error(`${meta.chunkRef} 未注册 ${id}`));
          };
          script.onerror = () => reject(new Error(`无法加载 ${meta.chunkRef}`));
          document.head.appendChild(script);
        }).catch(error => { delete moduleLoads[id]; throw error; });
        return moduleLoads[id];
      };
      const isRiskStatus = status => /CONFLICT|GAP|UNKNOWN|BROKEN|NOT_SYNCED|PARTIAL|待确认|冲突|缺口/i.test(status || "") || RISK_WORDS.some(word => String(status || "").includes(word));
      const allEntries = () => {
        const systems = KB.systems.map(item => ({...item, module:"system", path:`系统 / ${groupById(item.group)?.name || ""}`, detail:hasDetail(item.id)}));
        const rules = KB.combat.rules.map(item => ({...item, module:"combat", path:"战斗 / 战斗规则"}));
        const characters = KB.combat.character.map(item => ({...item, module:"combat", path:"战斗 / 角色设计"}));
        const numeric = KB.numeric.map(item => ({...item, module:"numeric", path:"数值"}));
        return [...systems, ...rules, ...characters, ...numeric];
      };
      const detailAtomEntries = () => window.VGAME_KB_SEARCH || [];
      const entryById = id => allEntries().find(entry => entry.id === id) || detailAtomEntries().find(entry => entry.id === id) || KB.projectPillars.find(item => item.id === id);

      function renderInlineMarkdown(text) {
        let value = h(text);
        value = value.replace(/`([^`]+)`/g, "<code>$1</code>");
        value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        value = value.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
        value = value.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        return value;
      }

      function renderSimpleMarkdown(md) {
        const lines = md.split("\n");
        let html = "";
        let inList = false;
        let inTable = false;
        let tableRows = [];
        for (const line of lines) {
          const trimmed = line.trim();
          if (/^#{1,6}\s/.test(trimmed)) {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (inTable) { html += "</tbody></table>"; inTable = false; }
            const level = trimmed.match(/^#+/)[0].length;
            const text = trimmed.replace(/^#+\s/, "");
            html += `<h${level}>${renderInlineMarkdown(text)}</h${level}>`;
          } else if (/^>\s?/.test(trimmed)) {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (inTable) { html += "</tbody></table>"; inTable = false; }
            html += `<blockquote>${renderInlineMarkdown(trimmed.replace(/^>\s?/, ""))}</blockquote>`;
          } else if (/^\d+\.\s/.test(trimmed)) {
            if (!inList) { html += '<ol data-md-list="ordered">'; inList = "ol"; }
            html += `<li>${renderInlineMarkdown(trimmed.replace(/^\d+\.\s/, ""))}</li>`;
          } else if (/^[-*]\s/.test(trimmed)) {
            if (!inList) { html += "<ul>"; inList = "ul"; }
            html += `<li>${renderInlineMarkdown(trimmed.replace(/^[-*]\s/, ""))}</li>`;
          } else if (/^\|/.test(trimmed)) {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (/^\|[-\s|]+\|$/.test(trimmed)) continue;
            if (!inTable) { html += "<table class=\"relation-table\"><tbody>"; inTable = true; }
            const cells = trimmed.split("|").filter((_, i, a) => i > 0 && i < a.length - 1);
            html += `<tr>${cells.map(c => `<td>${renderInlineMarkdown(c.trim())}</td>`).join("")}</tr>`;
          } else if (trimmed === "") {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (inTable) { html += "</tbody></table>"; inTable = false; }
          } else {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (inTable) { html += "</tbody></table>"; inTable = false; }
            html += `<p>${renderInlineMarkdown(trimmed)}</p>`;
          }
        }
        if (inList) html += inList === "ol" ? "</ol>" : "</ul>";
        if (inTable) html += "</tbody></table>";
        return html;
      }

      function loadReview() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return { schemaVersion: 1, frameworkVersion: KB.meta.version, comments: {}, ...parsed, comments: parsed.comments || {} };
        } catch {
          return { schemaVersion: 1, frameworkVersion: KB.meta.version, comments: {} };
        }
      }

      function persistReview() {
        review.savedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(review));
      }

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toastEl.classList.remove("show"), 1900);
      }

      function routeHref(module, id, sectionId) {
        if (!id) return `#${module}`;
        let href = `#${module}/${encodeURIComponent(id)}`;
        if (sectionId) href += `/${encodeURIComponent(sectionId)}`;
        return href;
      }

      function navigate(module, id, sectionId) {
        const nextHash = routeHref(module, id, sectionId);
        if (location.hash === nextHash) {
          // hash 未变化时浏览器不会触发 hashchange；搜索结果重复点击仍必须重新渲染、定位和高亮。
          closeDrawer();
          void renderRoute();
          return;
        }
        location.hash = nextHash.slice(1);
      }

      function currentRoute() {
        const raw = (location.hash || "#project").slice(1);
        const segs = raw.split("/");
        const module = segs[0] || "project";
        const moduleId = module || "project";
        // 兼容旧路由 #M01 / #M02 → 重定向到 #module/M01 / #module/M02
        if (moduleId === "M01" || moduleId === "M02") {
          return { module: "module", id: moduleId, redirect: true };
        }
        // 支持 #module/M01/M01-S3 格式（module/section 深链）
        if (moduleId === "module" && segs.length >= 2) {
          const mid = decodeURIComponent(segs[1] || "");
          const sid = segs.length >= 3 ? decodeURIComponent(segs.slice(2).join("/")) : null;
          return { module: "module", id: mid, sectionId: sid };
        }
        return { module: moduleId, id: segs[1] ? decodeURIComponent(segs[1]) : null };
      }

      function renderModuleNav() {
        moduleNav.innerHTML = KB.modules.map(module => `
          <button class="module-tab${module.id === activeModule ? " active" : ""}" type="button" data-route="${h(module.id)}">
            <span class="tab-code">${h(module.code)} / ${h(module.id.toUpperCase())}</span>
            <span class="tab-name">${h(module.name)}</span>
          </button>`).join("");
      }

      function setRail(module, items) {
        const data = moduleById(module) || { code:"90", name:"状态与证据", question:"某条知识是否现行，证据在哪里？" };
        railCode.textContent = `${data.code} / ${module.toUpperCase()}`;
        railTitle.textContent = data.name;
        railQuestion.textContent = data.question;
        subnav.innerHTML = items.map(item => `<button type="button" data-scroll="${h(item.id)}">${h(item.label)}</button>`).join("");
      }

      function hero(module, title, lead, source) {
        const moduleData = moduleById(module);
        return `<header class="page-hero">
          <div class="eyebrow">${h(moduleData ? `${moduleData.code} / ${moduleData.id}` : "90 / GOVERNANCE")}</div>
          <h1>${h(title)}</h1>
          <p class="page-lead">${h(lead)}</p>
          <div class="hero-actions">
            <button class="comment-button" type="button" data-comment="MOD-${h(module.toUpperCase())}" data-name="${h(title)}">评论本模块</button>
            ${source ? `<a class="source-button" href="${h(source)}">打开源 Markdown</a>` : ""}
          </div>
        </header>`;
      }

      function footer() {
        const count = Object.values(review.comments).filter(item => item.comment || item.suggestion || (item.decision && item.decision !== "unreviewed")).length;

      function saveDecisionCard(cardId, silent) {
        const canonicalCard = (KB.decisionCardRegistry?.cards || []).find(card => card.id === cardId);

        const commentEl = document.getElementById(`dc-comment-${cardId}`);
        const suggestionEl = document.getElementById(`dc-suggestion-${cardId}`);
        const activeDecision = document.querySelector(`[data-card="${CSS.escape(cardId)}"].decision-button.active`);
        const stateEl = document.getElementById(`dc-state-${cardId}`);
        review.comments[cardId] = {
          targetId: cardId,
          targetType: "decision-card",
          decision: activeDecision?.dataset.decision || "unreviewed",
          comment: commentEl?.value.trim() || "",
          suggestion: suggestionEl?.value.trim() || "",
          updatedAt: new Date().toISOString()
        };
        persistReview();
        if (stateEl) stateEl.textContent = silent ? "已自动暂存" : "已保存";

      function selectRadio(button) {
        if (button.disabled || button.getAttribute("aria-disabled") === "true") return;
        const group = button.closest('[role="radiogroup"]') || button.closest(".decision-row");
        if (!group) return;
        group.querySelectorAll('[role="radio"]').forEach(item => {
          const selected = item === button;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-checked", String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
      }

      function download(name, text, type) {
        const url = URL.createObjectURL(new Blob([text], {type}));
        const link = document.createElement("a");
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }

      async function renderRoute() {
        const epoch = ++routeEpoch;
        const route = currentRoute();
        let openRoutedDetail = Boolean(route.id);
        searchInput.value = "";
        if (route.module === "project") renderProject();
        else if (route.module === "system") {
          if (route.redirect) { location.hash = `#module/${route.id}`; return; }
          const target = route.id ? KB.systems.find(item => item.id === route.id) : null;
          if (target && hasDetail(target.id)) {
            let detail = detailById(target.id);
            if (!detail) {
              activeModule = "system";
              activeSystemGroup = target.group;
              setRail("system", []);
              main.innerHTML = `<div class="content-shell"><header class="page-hero"><div class="eyebrow">LOADING SYSTEM DETAIL</div><h1>正在按需加载${h(target.name)}</h1><p class="page-lead">目录和搜索索引保持轻量；只有进入该系统时才加载完整规则、关系与证据。</p></header></div>`;
              renderModuleNav();
              try {
                detail = await loadDetail(target.id);
              } catch (error) {
                if (epoch !== routeEpoch) return;
                main.innerHTML = `<div class="content-shell"><header class="page-hero"><div class="eyebrow">DETAIL LOAD ERROR</div><h1>系统正文加载失败</h1><p class="page-lead">${h(error.message)}。你仍可返回系统目录查看摘要索引。</p><div class="hero-actions"><button class="source-button" type="button" data-route="system">返回系统目录</button></div></header></div>`;
                renderModuleNav();
                return;
              }
              if (epoch !== routeEpoch || currentRoute().id !== target.id) return;
            }
            if (detail) {
              renderSystemDetail({...target, module:"system", path:`系统 / ${groupById(target.group)?.name || ""}`}, detail);
              openRoutedDetail = false;
            }
          } else {
            const targetGroup = target?.group || activeSystemGroup;
            renderSystem(targetGroup || activeSystemGroup);
          }
        }
        else if (route.module === "combat") renderCombat();
        else if (route.module === "numeric") renderNumeric();
        else if (route.module === "relations") renderRelations();
        else if (route.module === "governance") renderGovernance();
        else if (route.module === "module") {
          if (route.redirect) { location.hash = `#module/${route.id}`; return; }
          if (route.id) renderModuleDetail(route.id, route.sectionId);
          else renderProject();
          openRoutedDetail = false;
        }
        else if (route.module === "decisions") renderDecisionCards();
        else renderProject();
        if (epoch !== routeEpoch) return;
        renderModuleNav();
        if (openRoutedDetail) setTimeout(() => openDetail(route.id, null, route.module), 0);
        main.focus({preventScroll:true});
      }

      document.addEventListener("click", event => {
        const route = event.target.closest("[data-route]");
        if (route) { navigate(route.dataset.route); return; }
        const scroll = event.target.closest("[data-scroll]");
        if (scroll) { document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
        const entity = event.target.closest("[data-entity]");
        if (entity) {
          const mod = entity.dataset.module || activeModule;
          const eid = entity.dataset.entity;
          // 模块 section 搜索结果：导航到 #module/<parentId>/<sectionId>
          if (mod === "module") {
            const searchEntry = detailAtomEntries().find(e => e.id === eid && e.module === "module");
            if (searchEntry) { navigate("module", searchEntry.parentId, eid); return; }
          }
          navigate(mod, eid);
          return;
        }
        const comment = event.target.closest("[data-comment]");
        if (comment) { openDetail(comment.dataset.comment, comment.dataset.name, activeModule); return; }
        const sectionLoadBtn = event.target.closest(".section-load-btn");
        if (sectionLoadBtn) {
          const sid = sectionLoadBtn.dataset.sectionId;
          const anchor = sectionLoadBtn.dataset.anchor;
          const source = sectionLoadBtn.dataset.source;
          const contentEl = document.getElementById(`${sid}-content`);
          if (contentEl) {
            // 优先使用构建时编译进 module chunk 的 sectionContent（file:// 离线可用，不依赖 fetch）。
            // sectionContent 存在于已加载的 module detail 中（window.VGAME_MODULE_DETAILS）。
            const moduleId = sectionLoadBtn.dataset.moduleId || "";
            const moduleDetail = moduleId ? (window.VGAME_MODULE_DETAILS || {})[moduleId] : null;
            const section = moduleDetail ? (moduleDetail.sections || []).find(s => s.id === sid) : null;
            if (section && section.sectionContent) {
              contentEl.innerHTML = `<div class="section-md-body">${renderSimpleMarkdown(section.sectionContent)}</div>`;
              return;
            }
            // 回退：localhost/http 预览时尝试 fetch 源 Markdown（file:// 下会失败，但构建产物已内嵌正文）。
            contentEl.innerHTML = '<p class="section-desc">正在加载…</p>';
            fetch(source).then(r => r.text()).then(md => {
              const lines = md.split("\n");
              const anchorIdx = lines.findIndex(l => l.trim() === anchor);
              if (anchorIdx < 0) { contentEl.innerHTML = '<p class="section-desc">未找到对应锚点，请直接打开源 Markdown。</p>'; return; }
              let endIdx = lines.length;
              for (let i = anchorIdx + 1; i < lines.length; i++) {
                if (/^##\s/.test(lines[i]) && !lines[i].trim().startsWith("###")) { endIdx = i; break; }
              }
              const sectionMd = lines.slice(anchorIdx, endIdx).join("\n");
              contentEl.innerHTML = `<div class="section-md-body">${renderSimpleMarkdown(sectionMd)}</div>`;
            }).catch(err => { contentEl.innerHTML = `<p class="section-desc">加载失败：${h(err.message)}。请直接打开源 Markdown。</p>`; });
          }
          return;
        }
        const group = event.target.closest("[data-group]");
        if (group) {
          if (group.dataset.group !== "all") activeSystemGroup = group.dataset.group;
          document.querySelectorAll(".filter-chip").forEach(chip=>chip.classList.toggle("active", chip===group));
          document.getElementById("systemGroups").innerHTML = renderSystemGroup(group.dataset.group);
          return;
        }
        const decision = event.target.closest("[data-decision]");
        if (decision) {
          if (decision.dataset.card) {
            // 决策卡选择按钮
            const cardId = decision.dataset.card;
            selectRadio(decision);
            saveDecisionCard(cardId, true);
          } else {
            selectRadio(decision);
          }
          scheduleAutoSave();
          return;
        }
        if (event.target.id === "saveComment") saveActiveComment();
      });

      searchInput.addEventListener("input", event => {
        const value = event.target.value;
        if (value.trim().length >= 1) renderSearch(value);
        else void renderRoute();
      });

      drawerBody.addEventListener("input", event => {
        if (event.target.matches("textarea, input, select")) scheduleAutoSave();
      });
      drawerBody.addEventListener("change", event => {
        if (event.target.matches("textarea, input, select")) scheduleAutoSave();
      });

      // 决策卡评论自动暂存
      main.addEventListener("input", event => {
        if (event.target.matches("[data-card]")) {
          const cardId = event.target.dataset.card;
          if (cardId) saveDecisionCard(cardId, true);
        }
      });
      main.addEventListener("change", event => {
        if (event.target.matches("[data-card]")) {
          const cardId = event.target.dataset.card;
          if (cardId) saveDecisionCard(cardId, true);
        }
      });
      // 决策卡导出按钮
      main.addEventListener("click", event => {
        if (event.target.id === "exportDecisions") exportDecisionsJSON();
        else if (event.target.id === "exportDecisionsMd") exportDecisionsMarkdown();
      });

      document.getElementById("closeDrawer").addEventListener("click", closeDrawerFromUi);
      backdrop.addEventListener("click", closeDrawerFromUi);
      document.addEventListener("keydown", event => {
        const radio = event.target.closest?.('[role="radio"]');
        if (radio && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", " ", "Enter"].includes(event.key)) {
          const radios = [...radio.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')];
          let index = radios.indexOf(radio);
          if (event.key === "Home") index = 0;
          else if (event.key === "End") index = radios.length - 1;
          else if (["ArrowRight", "ArrowDown"].includes(event.key)) index = (index + 1) % radios.length;
          else if (["ArrowLeft", "ArrowUp"].includes(event.key)) index = (index - 1 + radios.length) % radios.length;
          event.preventDefault();
          const target = radios[index];
          target.focus();
          if (![" ", "Enter"].includes(event.key)) target.click(); else radio.click();
          return;
        }
        if (event.key === "Escape" && drawer.classList.contains("open")) { event.preventDefault(); closeDrawerFromUi(); return; }
        if (event.key === "Tab" && drawer.classList.contains("open")) {
          const focusable = [...drawer.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter(el => !el.hidden && el.offsetParent !== null);
          if (!focusable.length) { event.preventDefault(); drawer.focus(); return; }
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });
      document.getElementById("exportComments").addEventListener("click", event => {
        if (event.shiftKey) exportMarkdown(); else exportReview();
      });
      document.getElementById("exportComments").addEventListener("contextmenu", event => { event.preventDefault(); exportMarkdown(); });
      window.addEventListener("hashchange", () => { closeDrawer(); void renderRoute(); });

      void renderRoute();
    })();
  </script>
</body>
</html>
